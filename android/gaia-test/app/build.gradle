plugins { id 'com.android.application' }

android {
    namespace 'be.ryane.gaiatest'
    compileSdk 35
    defaultConfig {
        applicationId 'be.ryane.gaiatest'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '0.12.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // One fixed key for local and CI builds, so every release installs over the previous one.
    // It is public on purpose (community sideload build, not a store app): anyone can sign with it.
    signingConfigs {
        shared {
            storeFile file('../keystore/m4-shared.jks')
            storePassword 'android'
            keyAlias 'm4shared'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.shared }
        debug { signingConfig signingConfigs.shared }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'   // plain JVM tests only (app/src/test), nothing ships in the APK
}
