name: Release APK

# Runs the unit tests and publishes the COMMITTED APK (android/gaia-test/release/) to the Releases tab.
# It does not upload a CI rebuild: builds are not byte-identical across machines, so a rebuilt
# asset never matched release/SHA256SUMS (T43, 0.12.0-0.14.0). Now repo APK, SHA256SUMS and the
# release asset are the same file. The APK must be committed with its SHA256SUMS line first.
# Two ways to cut a release, both create a Release tagged v<versionName>:
#   - push a version tag:  git tag v0.6 && git push origin v0.6
#   - or, once this file is on the default branch, Actions tab >
#     "Release APK" > Run workflow.
# The tag is derived from versionName in android/gaia-test/app/build.gradle,
# so bump that before cutting a release. A pushed tag must equal v<versionName>,
# the unit tests (Android and Python) must pass, and a manual run refuses a version that
# already has a release, or nothing is published.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      allow_existing:
        description: 'Re-publish a version that already has a release (normally never: bump versionName instead)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/gaia-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''   # skip the action's default 'tools' package (removed by Google; breaks the run)

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Check the tag matches versionName
        if: github.event_name == 'push'
        run: |
          ver=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${ver} (expected v${ver})." >&2
            exit 1
          fi

      - name: Refuse to re-publish an existing version
        if: github.event_name == 'workflow_dispatch' && inputs.allow_existing != true
        run: |
          ver=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          if git ls-remote --exit-code --tags origin "refs/tags/v${ver}" >/dev/null 2>&1; then
            echo "v${ver} already has a release. Bump versionName and versionCode, commit the new APK and its SHA256SUMS line, then run again." >&2
            echo "(To re-publish on purpose, run with allow_existing = true.)" >&2
            exit 1
          fi

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest --no-daemon

      - name: Python safety tests (PC client, tools, blocklist parity)
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s windows-client -p "test_*.py"
          python3 -m unittest discover -s tools -p "test_*.py"
          python3 tools/blocklist_parity_test.py

      - name: Take the committed APK, checked against SHA256SUMS
        id: ver
        run: |
          ver=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          apk="m4-gaia-test-${ver}.apk"
          line=$(grep -E "  ${apk//./\\.}\$" release/SHA256SUMS || true)
          if [ ! -f "release/${apk}" ] || [ -z "$line" ]; then
            echo "release/${apk} or its SHA256SUMS line is missing. Commit both before releasing." >&2
            exit 1
          fi
          (cd release && echo "$line" | sha256sum -c -)
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cp "release/${apk}" "${GITHUB_WORKSPACE}/dist/${apk}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: m4-gaia-test-apk
          path: dist/*.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            MOMENTUM 4 GAIA test app, v${{ steps.ver.outputs.ver }}. Sideload on Android (allow installs from your browser, "install anyway" if Play Protect warns; it is debug-signed).

            Unofficial community build. See the README for what it does and the safety notes.
